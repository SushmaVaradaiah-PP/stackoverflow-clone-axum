[package]
name = "stackoverflow-clone-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
log = "0.4.34"
pretty_env_logger = "0.5.0"
dotenvy = "0.15.7"
sqlx = { version = "0.7.2", features = [
    "runtime-tokio-rustls",
    "postgres",
    "time",
    "uuid",
] }
async-trait = "0.1.92"
thiserror = "2.0.20"
